name: Build and Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Download yt-dlp
      run: |
        mkdir -p src-tauri/binaries
        curl -L -o src-tauri/binaries/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe

    - name: Download ffmpeg
      shell: pwsh
      run: |
        mkdir -p src-tauri/binaries -Force
        curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp
        $binDir = Get-ChildItem -Path ffmpeg-temp -Recurse -Directory | Where-Object Name -eq "bin" | Select-Object -First 1
        Copy-Item "$($binDir.FullName)\*.exe" src-tauri/binaries/
        Copy-Item "$($binDir.FullName)\*.dll" src-tauri/binaries/
        Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-temp

    - name: Run Tests (Rust)
      run: cargo test
      working-directory: ./src-tauri

    - name: Build Tauri App
      run: npm run tauri build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BestDownloadManager-Windows
        path: src-tauri/target/release/bundle/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/msi/*.msi
        body: |
          **Best Download Manager ${{ github.ref_name }}**

          ### What's included
          - Self-contained installer — no runtime dependencies required
          - **yt-dlp** (built-in) — YouTube video downloads
          - **ffmpeg** (built-in) — high-quality video/audio muxing
          - Native BitTorrent engine (magnet links)
          - Multi-threaded HTTP download engine
          - Download queue & scheduler
        make_latest: true
