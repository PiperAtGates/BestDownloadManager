name: Build and Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Download yt-dlp
      run: |
        mkdir -p src-tauri/binaries
        curl -L -o src-tauri/binaries/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe

    - name: Download ffmpeg
      shell: pwsh
      run: |
        mkdir -p src-tauri/binaries -Force
        curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
        Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-temp
        Copy-Item (Get-ChildItem -Path ffmpeg-temp -Recurse -Filter "ffmpeg.exe").FullName src-tauri/binaries/ffmpeg.exe
        Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-temp

    - name: Run Tests (Rust)
      run: cargo test
      working-directory: ./src-tauri

    - name: Build Tauri App
      run: npm run tauri build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BestDownloadManager-Windows
        path: src-tauri/target/release/bundle/
